# .github/workflows/metrics.yml
#
# Genera dos imágenes SVG y las commitea en este mismo repo:
#   - github-stats.svg    → actividad, repos y lenguajes más usados
#   - wakatime-week.svg   → tiempo de código de los últimos 7 días
#
# Requiere dos secrets en Settings → Secrets and variables → Actions:
#   METRICS_TOKEN   → Personal Access Token (classic) de GitHub
#   WAKATIME_TOKEN  → API key de WakaTime (wakatime.com/settings/account)

name: Metrics

on:
  # Todos los días a la 1:00 AM hora de Puebla (07:00 UTC)
  schedule: [{ cron: "0 7 * * *" }]
  # Para correrlo a mano desde la pestaña Actions
  workflow_dispatch:
  # Y también al hacer push a main
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # ── 1. Stats de GitHub ────────────────────────────────────────────
      - name: GitHub stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: MonicaPArroyo
          filename: github-stats.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: America/Mexico_City
          config_theme: dark
          # Lenguajes más usados
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: css, scss, html, blade
          # Racha de commits, siempre queda bonita
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_facts: no
          plugin_habits_charts: yes

      # ── 2. Stats semanales de WakaTime ────────────────────────────────
      - name: WakaTime weekly stats
        uses: lowlighter/metrics@latest
        with:
          # Este render no toca la API de GitHub, así que no necesita PAT
          token: NOT_NEEDED
          filename: wakatime-week.svg
          base: ""
          config_timezone: America/Mexico_City
          config_theme: dark
          plugin_wakatime: yes
          plugin_wakatime_token: ${{ secrets.WAKATIME_TOKEN }}
          plugin_wakatime_days: 7
          plugin_wakatime_sections: time, projects, projects-graphs, languages, languages-graphs, editors
